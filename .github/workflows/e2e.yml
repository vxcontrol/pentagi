# The fork-safe gate: read-only permissions, no secrets, no write steps.
# PR comments are posted by e2e-report.yml (workflow_run) which runs in
# base-repo context — a fork PR's GITHUB_TOKEN cannot write comments.
name: E2E

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E (mock tier, production bundle)
        working-directory: frontend
        run: pnpm e2e

      - name: Upload results.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: frontend/e2e/test-results/results.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/e2e/blob-report
            frontend/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Tier 2: branch-built image + isolated compose stack + the mock-LLM agent
  # loop. Not part of the PR gate — nightly and on-demand only.
  e2e-local:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Tier 2 (branch image + mock LLM)
        run: ./frontend/e2e/tools/run-local-tier.sh

      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-local-report
          path: frontend/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
