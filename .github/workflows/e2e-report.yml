# Posts the sticky E2E PR comment. Runs in base-repo context (writable token)
# after the fork-safe E2E workflow completes. Never checks out or executes PR
# code; the only artifact-derived values rendered are numeric counts.
name: E2E report

on:
  workflow_run:
    workflows: ["E2E"]
    types:
      - completed

permissions:
  actions: read
  pull-requests: write

# A cancelled superseded run must not race the report of the run that
# replaced it and become the sticky comment's last writer.
concurrency:
  group: e2e-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: e2e-results
          path: results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post sticky comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;

            // workflow_run.pull_requests is empty for fork PRs — resolve by head SHA.
            let prNumber = run.pull_requests[0]?.number;
            if (!prNumber) {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: run.head_sha,
              });
              prNumber = prs[0]?.number;
            }
            if (!prNumber) {
              core.info(`No PR found for ${run.head_sha}; skipping comment.`);
              return;
            }

            let runJobs = [];
            try {
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              runJobs = jobs.jobs;
            } catch (error) {
              core.info(`run jobs unavailable: ${error}`);
            }

            // Adding a label skips every gate job, so this run has nothing to say about
            // the PR — commenting would overwrite the previous run's verdict with "no
            // results file".
            const mockJob = runJobs.find((job) => /mock/.test(job.name));
            if (!mockJob || mockJob.conclusion === 'skipped') {
              core.info('No completed mock job in this run; leaving the sticky comment as it is.');
              return;
            }

            let statsLine = 'The run produced no results file (it likely failed before the tests started).';
            let noFailures = false;
            try {
              const report = JSON.parse(fs.readFileSync('results/results.json', 'utf8'));
              const n = (value) => Number(value) || 0;
              const { expected, unexpected, flaky, skipped } = report.stats ?? {};
              statsLine = `**${n(expected)} passed**, ${n(unexpected)} failed, ${n(flaky)} flaky, ${n(skipped)} skipped.`;
              noFailures = n(unexpected) === 0;
            } catch (error) {
              core.info(`results.json unavailable: ${error}`);
            }

            // Both halves are required: results.json is written before an abort can be
            // observed, so a run killed by the global timeout still reports zero failures.
            const mockPassed = noFailures && mockJob.conclusion === 'success';

            // The visual job is advisory (never a required check), so the header must
            // track the mock gate, not the whole-run conclusion — otherwise a visual-only
            // diff reads as a mock failure over a "0 failed" stats line.
            const visualDiffers = runJobs.some((job) => /visual/.test(job.name) && job.conclusion === 'failure');

            const conclusion = !mockPassed ? '❌' : visualDiffers ? '⚠️' : '✅';
            const marker = '<!-- e2e-report -->';
            const advisoryLine = visualDiffers
              ? '⚠️ **Visual snapshots differ** — advisory only, does not block merge. Download the `e2e-visual-diffs` artifact to compare expected / actual / diff.'
              : null;
            const body = [
              marker,
              `### ${conclusion} E2E (mock tier)`,
              '',
              statsLine,
              ...(advisoryLine ? ['', advisoryLine] : []),
              '',
              `[Run + report/trace artifacts](${run.html_url}) · commit ${run.head_sha.slice(0, 7)}`,
              '',
              'Debug a red run locally: download the `e2e-report` artifact and open the trace with `pnpm exec playwright show-trace <trace.zip>`.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            // Author check: anyone can pre-post the marker; only the bot's own
            // comment may claim the sticky slot.
            const existing = comments.find(
              (comment) =>
                comment.body?.startsWith(marker) &&
                comment.user?.type === 'Bot' &&
                comment.user?.login === 'github-actions[bot]',
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
