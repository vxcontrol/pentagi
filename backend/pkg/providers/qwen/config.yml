# Qwen Cloud and Alibaba Cloud Model Studio agent configuration.
#
# Every assigned model is available from both qwen_cloud and dashscope. The
# catalogue is wider because it is the union of both platforms.
#
# Qwen3.6 Flash handles utility calls. DeepSeek V4.1 Flash handles routine tool
# use, while DeepSeek V4 Pro handles planning and advice.
#
# Thinking controls are left unset because Qwen Cloud does not let these models
# disable reasoning while DashScope does. Both gateways apply their defaults.

simple:
  model: "qwen3.6-flash"
  temperature: 0.3
  n: 1
  max_tokens: 8192
  price:
    input: 0.25
    output: 1.5
    cache_read: 0.05

simple_json:
  model: "qwen3.6-flash"
  temperature: 0.3
  n: 1
  max_tokens: 4096
  json: true
  price:
    input: 0.25
    output: 1.5
    cache_read: 0.05

