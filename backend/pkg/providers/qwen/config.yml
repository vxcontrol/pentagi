# Qwen (Alibaba Cloud DashScope) agent configuration.
#
# DashScope also resells third-party models (GLM, DeepSeek) through the same
# endpoint, using the same flat `enable_thinking` extra_body key for every
# vendor — NOT their native APIs' own thinking syntax (compare glm/config.yml,
# deepseek/config.yml).
#
# Tiers: deepseek-v4-flash-0731 (utility: simple/simple_json/reflector/
# searcher/enricher) -> qwen3.7-plus (workhorse: primary_agent/assistant/
# coder/installer/pentester) -> glm-5.2 (adviser) -> deepseek-v4-pro
# (generator/refiner, flagship-tier planning).
#
# qwen3.8-max was tried for generator/refiner but DROPPED: DashScope's content
# moderation (InternalError.Algo.DataInspectionFailed) rejects pentest-flavored
# planning prompts for Qwen models with a hard 400 and no fallback. GLM/DeepSeek
# on the same endpoint do not trigger this filter for the same input.
#
# extra_body keys (flat, top-level, not nested under "thinking"):
#   - enable_thinking: MUST be false for simple/simple_json, or
#     reasoning_content leaks into content and corrupts deterministic output.
#   - preserve_thinking: Qwen-only; never set on glm-5.2/deepseek-v4-*.
#   - clear_thinking: GLM-only, inverted (false = retain, already default).
#
# reasoning.effort is intentionally NOT set: this deployment's LiteLLM proxy
# 400s on the top-level `reasoning_effort` param for glm-5.2/deepseek-v4-flash
# -0731 (stale per-model capability table). Fix proxy-side (`drop_params:
# true`) before reintroducing it. Adaptive reasoning mode doesn't apply here
# either — Anthropic-only concept in this codebase.

simple:
  model: "deepseek-v4-flash-0731"
  temperature: 0.6
  n: 1
  max_tokens: 8192
  extra_body:
    enable_thinking: false
  price:
    input: 0.2
    output: 0.4
    cache_read: 0.04

simple_json:
  model: "deepseek-v4-flash-0731"
  temperature: 0.6
  n: 1
  max_tokens: 4096
  json: true
  extra_body:
    enable_thinking: false
  price:
    input: 0.2
    output: 0.4
    cache_read: 0.04

