# Claude 5 / 4 series - Most capable models for advanced security operations
- name: claude-fable-5-1
  description: Anthropic's most capable model, succeeding Fable 5. Adaptive thinking is always on (budget thinking and an explicit disable are rejected); sampling parameters are not supported. Cache reads are billed at 0.025x the base input rate rather than the 0.1x used by every other model. Runs the Claude 4.7+ tokenizer, which yields about 30% more tokens for the same text than Claude 4.6 and earlier, so this per-token price is not comparable to older generations.
  thinking: true
  reasoning:
    mode: adaptive-only
    efforts: [low, medium, high, xhigh, max]
  release_date: 2026-08-28
  context_window: 1000000
  max_output_tokens: 128000
  price:
    input: 10.0
    output: 50.0
    cache_read: 0.25
    cache_write: 12.5

