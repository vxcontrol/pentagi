# Z.AI GLM agent configuration.
#
# Strategy: glm-5.3 for critical reasoning and glm-5.3-flash for inexpensive,
# latency-sensitive work. Both require thinking to remain enabled and accept
# low, high, or max reasoning effort.
#
# extra_body.thinking.clear_thinking=false enables Preserved Thinking (Z.AI docs):
# on the standard API endpoint Z.AI defaults to clearing reasoning_content between
# turns, which hurts agent loops with tool calls. Setting clear_thinking=false
# preserves reasoning_content across turns, improving reasoning continuity and cache
# hit rates. PreserveReasoning in the GLM door serializes reasoning_content back
# to the API.

simple:
  model: "glm-5.3-flash"
  temperature: 1.0
  top_p: 0.95
  n: 1
  max_tokens: 8192
  reasoning:
    effort: low
  extra_body:
    thinking:
      clear_thinking: false
    tool_choice: auto
  price:
    input: 0.15
    output: 0.50
    cache_read: 0.03

