# AI/ML API (https://aimlapi.com) model catalog.
#
# Ids are the gateway's canonical, vendor-namespaced ids and are sent verbatim.
# The gateway also publishes short aliases (`deepseek-v4-flash`), but an alias can
# resolve to a different model than its name implies — `deepseek/deepseek-chat`,
# for instance, is both its own listed model and an alias of deepseek-v4-flash —
# so only canonical ids appear here.
#
# Prices are USD per 1M tokens as published by
# `GET https://api.aimlapi.com/v1/models?include=all` on 2026-09-03. That endpoint
# omits pricing, capabilities and modalities unless `include=all` is passed. Every
# id below was checked against both the `id` and `aliases` sets of that response.
#
# The roster deliberately avoids OpenAI/Anthropic/Google models even though the
# gateway carries them: PentAGI runs offensive-security workloads, and those
# vendors' guardrails false-positive on legitimate exploit development. This is
# the same reasoning already applied in examples/configs/openrouter.provider.yml.

# --- DeepSeek: utility tier and the provider-wide fallback model ---
- name: deepseek/deepseek-v4-flash
  description: DeepSeek V4 Flash via AI/ML API - cost-efficient workhorse with hybrid thinking, tool calling, parallel tool calls and structured output. 1M context, 384K max output. Default model for the utility agents.
  thinking: true
  price:
    input: 0.182
    output: 0.364
    cache_read: 0.00364

- name: deepseek/deepseek-v4-pro
  description: DeepSeek V4 Pro via AI/ML API - higher-tier reasoning model for complex logic, exploit analysis and long multi-step planning. 1M context, 384K max output.
  thinking: true
  price:
    input: 0.5655
    output: 1.131
    cache_read: 0.0047125

