# Bundled Gemini defaults use gemini-3.1-flash-lite for simple, JSON,
# reflection, search, and enrichment; complex agent roles use the newer
# gemini-3.5-flash-lite. The latter produced subtask_list on eight of ten
# saved generator chains immediately and after a safe memorist continuation
# on the other two. Both models passed a synthetic API/config smoke for each
# role option class; other production roles were not replayed.
simple:
  model: gemini-3.1-flash-lite
  temperature: 1.0
  top_p: 0.95
  n: 1
  max_tokens: 8192
  price:
    input: 0.25
    output: 1.50
    cache_read: 0.025

simple_json:
  model: gemini-3.1-flash-lite
  temperature: 1.0
  top_p: 0.95
  n: 1
  max_tokens: 4096
  json: true
  price:
    input: 0.25
    output: 1.50
    cache_read: 0.025

