# DeepSeek V4 agent configuration.
#
# Strategy: prefer deepseek-flash (4x cheaper) for the "workhorse" agents,
# reserve deepseek-v4-pro for complex multi-step reasoning (planning, mentor,
# code generation, vulnerability analysis, orchestration).
#
# Hyperparameters note:
# - flash utility agents disable thinking via reasoning.mode "off"; langchaingo
#   turns that into DeepSeek's thinking.type=disabled wire.
# - thinking-enabled agents set reasoning.effort; thinking runs by default on
#   these models, so no explicit enable toggle is sent.

simple:
  model: deepseek-flash
  temperature: 0.3
  top_p: 0.9
  n: 1
  max_tokens: 8192
  reasoning:
    mode: "off"
  price:
    input: 0.30
    output: 1.20
    cache_read: 0.006

simple_json:
  model: deepseek-flash
  temperature: 0.3
  top_p: 0.9
  n: 1
  max_tokens: 4096
  json: true
  reasoning:
    mode: "off"
  price:
    input: 0.30
    output: 1.20
    cache_read: 0.006

primary_agent:
  model: deepseek-v4-pro
  n: 1
  max_tokens: 16384
  reasoning:
    effort: high
  price:
    input: 1.32
    output: 3.96
    cache_read: 0.044

