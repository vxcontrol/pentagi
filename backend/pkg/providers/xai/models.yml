- name: grok-4.3
  description: Grok 4.3 - 1M context at a quarter of the flagship output price. Supports configurable reasoning; the bundled agent config leaves effort unset. Prices apply to a prompt under 200k tokens - at or above that the vendor doubles the rate for the whole request.
