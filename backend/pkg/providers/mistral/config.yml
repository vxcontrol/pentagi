# Mistral agent configuration.
#
# Strategy: mistral-small-latest for utility and read-heavy agents,
# mistral-large-latest for execution agents, and mistral-medium-latest for
# planning and advice.
#
# Prices repeat models.yml so a per-agent override carries its own cost.

simple:
  model: mistral-small-latest
  temperature: 0.3
  top_p: 0.9
  n: 1
  max_tokens: 8192
  price:
    input: 0.15
    output: 0.60
    cache_read: 0.015

simple_json:
  model: mistral-small-latest
  temperature: 0.3
  top_p: 0.9
  n: 1
  max_tokens: 4096
  json: true
  price:
    input: 0.15
    output: 0.60
    cache_read: 0.015

