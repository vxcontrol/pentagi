version: "2"

linters:
  settings:
    staticcheck:
      # golangci-lint's own default set, minus QF1001. The -ST10xx entries are the
      # defaults themselves: dropping them re-enables those checks.
      checks:
        - all
        - -QF1001
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    errcheck:
      exclude-functions:
        - (*github.com/jinzhu/gorm.DB).AddError
        - (net/http.ResponseWriter).Write

  exclusions:
    # strict, not lax: lax treats any "Code generated by" line as a marker, which
    # swallows pkg/graph/schema.resolvers.go — gqlgen writes that header but keeps
    # our resolver implementations across regeneration, so it is our code.
    generated: strict
    presets:
      - std-error-handling
    paths:
      # Fern generates this package but omits the DO NOT EDIT header there, so
      # `generated` cannot recognise it. Regenerating overwrites any edit.
      - pkg/observability/langfuse/api/internal
    warn-unused: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
