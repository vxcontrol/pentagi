# APOC static configuration for the Graphiti stack (examples/neo4j/conf).
#
# Purely static plugin settings; none of these have an equivalent NEO4J_*
# environment variable in .env.example, so there is nothing to dedupe here.
# The APOC plugin jar itself ships in the sibling ../plugins directory and is
# bind-mounted read-only to /plugins by docker-compose-graphiti.yml (via
# NEO4J_DIR); Neo4j loads any jar present there automatically at startup.
apoc.export.file.enabled=true
apoc.import.file.enabled=true
apoc.import.file.use_neo4j_config=true
apoc.import.file.max_memory=1G
