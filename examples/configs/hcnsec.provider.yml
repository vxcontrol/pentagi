# HCNSec (新疆幻城网安科技有限责任公司 / Xinjiang Huancheng Network Security Technology
# Co., Ltd.) provider configuration. OpenAI-compatible relay at https://api.hcnsec.cn/v1
# (NewAPI-based aggregator, 195+ upstream models). Each model is tuned per its own
# vendor's official sampling/thinking-toggle recommendations rather than a single
# shared profile - see per-model notes below.
#
# History: MiniMax-M2.7 and glm-4.7 were dropped first (unusably slow on this relay:
# ~12 t/s/83s avg latency and ~26 t/s/19s avg latency respectively). Their replacement,
# step-3.7-flash, turned out unstable on this relay too, so it was dropped as well.
# Everything agentic now runs on the two Qwen models already used elsewhere in this
# file, plus kat-coder-pro-v2 for the highest-stakes plan/refine roles.
#
# Qwen3.6-35B-A3B (MoE, 35B total / 3B active, hybrid thinking) -> simple/simple_json
# (thinking OFF) and reflector/searcher/enricher/pentester (thinking ON, the hybrid
# default). Sampling per Qwen's own model card (huggingface.co/Qwen/Qwen3.6-35B-A3B):
#   - thinking ON,  general tasks: temp=1.0, top_p=0.95, top_k=20, min_p=0.0, pp=1.5, rp=1.0
#   - non-thinking, general tasks: temp=0.7, top_p=0.80, top_k=20, min_p=0.0, pp=1.5, rp=1.0
# Thinking is toggled via extra_body.chat_template_kwargs.enable_thinking (vLLM wire
# format - matches this repo's other self-hosted Qwen3.6 configs, e.g.
# vllm-qwen3.6-27b-fp8.provider.yml). pentester was moved here (off step-3.7-flash)
# with thinking left ON: pentesting decisions benefit from the model's own hybrid
# default rather than forcing it off.
#
# Qwen3-Coder-Next-FP8 -> primary_agent/assistant/coder/installer/adviser. Instruct-
# only coding model (no hybrid thinking, no toggle needed) - now covers the main
# agent loop too, not just generator/refiner, after step-3.7-flash's instability.
# Qwen's own recommendation (HF model card, Unsloth docs): temperature=1.0,
# top_p=0.95, top_k=40, min_p=0.01, repetition_penalty=1.0.
#
# kat-coder-pro-v2 -> generator/refiner. Kwaipilot's (Kuaishou) closed-source flagship
# agentic coding model (72B active / 1T+ total MoE, 256K context, no hybrid-thinking
# toggle - that lands in V2.5). No task-specific sampling guide is published; every
# official distributor (GMI Cloud, Atlas Cloud, OpenRouter, wcode.net) quotes the same
# API defaults, used verbatim here: temperature=0.7, top_p=1.0.
#
# adviser wasn't specified in the model brief for this file; grouped with
# primary_agent/assistant on Qwen3-Coder-Next-FP8 since it fills the same
# planning/orchestration role in a flow.
#
# Prices from the hcnsec.cn model catalog (CNY/1M tokens), converted to USD at a
# fixed 6.6 CNY = 1 USD rate: $/1M = CNY_price / 6.6. Qwen3-Coder-Next-FP8's and
# kat-coder-pro-v2's catalog entries show no cached-input price, so cache_read is
# omitted for both.

simple:
  model: "Qwen3.6-35B-A3B"
  temperature: 0.7
  top_k: 20
  top_p: 0.8
  min_p: 0.0
  presence_penalty: 1.5
  repetition_penalty: 1.0
  n: 1
  max_tokens: 8192
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
  price:
    input: 0.17
    output: 1.11
    cache_read: 0.02

