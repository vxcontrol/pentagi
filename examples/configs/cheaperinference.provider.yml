# Cheaper Inference provider configuration (OpenAI-compatible LLM gateway).
# Use via the custom LLM endpoint:
#   LLM_SERVER_URL=https://api.cheaperinference.com/v1
#   LLM_SERVER_KEY=ci_live_...
#   LLM_SERVER_CONFIG_PATH=/opt/pentagi/conf/cheaperinference.provider.yml
# Model IDs are bare (e.g. gpt-5.4, claude-sonnet-5). Prices are in USD per 1M tokens
# and are indicative - see https://cheaperinference.com/markets for current prices.

simple:
  model: "gpt-5.4-mini"
  n: 1
  max_tokens: 4000
  price:
    input: 0.525
    output: 3.15

simple_json:
  model: "gpt-5.4-mini"
  n: 1
  max_tokens: 4000
  json: true
  price:
    input: 0.525
    output: 3.15

primary_agent:
