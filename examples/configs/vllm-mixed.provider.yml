# Mixed vLLM Provider Configuration
# Qwen3.8-27B-FP8 for lightweight / coding agents; DeepSeek-V4-Flash for planning & reasoning agents
#
# Qwen3.8-27B-FP8 (official Qwen recommendations for vLLM):
# - Thinking mode enabled by default (no extra_body needed)
# - General tasks: temp=1.0, top_p=0.95, top_k=20, min_p=0.0, pp=1.5, rp=1.0
# - Precise coding: temp=0.6, top_p=0.95, top_k=20, min_p=0.0, pp=0.0, rp=1.0
# - Non-thinking: temp=0.7, top_p=0.8 (+ enable_thinking: false via extra_body)
#
# DeepSeek-V4-Flash on vLLM (0731 tokenizer; confirmed on vLLM 0.28.0):
# - Default is Non-think. Cloud extra_body.thinking.type is ignored.
# - The nested "reasoning":{"effort":...} object is ignored; PentAGI sends reasoning.effort
#   as the top-level reasoning_effort this server reads.
# - Enable Think High via extra_body.chat_template_kwargs plus reasoning.effort for
#   PentAGI/ctester.
# - Sampling: temperature=1.0, top_p=1.0 (0731 agentic: top_p=0.95 also fine)
# - Think Max (reasoning_effort=max) needs --max-model-len >= 384K; do not use it
#   on a 160K context server.

simple:
  model: "Qwen/Qwen3.8-27B-FP8"
  temperature: 0.7
  top_k: 20
  top_p: 0.8
  min_p: 0.0
  presence_penalty: 1.5
  repetition_penalty: 1.0
  n: 1
  max_tokens: 32768
  extra_body:
    chat_template_kwargs:
      enable_thinking: false

