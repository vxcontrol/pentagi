# DeepInfra config. Direct-hosted models only - excludes Partner-tagged entries
# (Qwen3-Max-Thinking, Seed-1.6/2.0-*, MiniMax-M2.7-Turbo) and Google/Gemma
# (guardrail false positives on offensive-security content).
#
# MiniMaxAI/MiniMax-M3      -> simple/reflector/searcher/enricher/adviser
# moonshotai/Kimi-K2.6      -> primary_agent/assistant/pentester/simple_json
# zai-org/GLM-5.2           -> generator/refiner (effort: xhigh only; "max" = HTTP 422)
# moonshotai/Kimi-K2.7-Code -> coder/installer (occasional HTTP 429, transient)
#
# Dropped: DeepSeek-V4-flash (HTTP 400, no deployment), GLM-4.7-flash (hangs,
# never errors). Kimi-K2.5 rejected for simple_json: cheaper but corrupts plain
# JSON (turned "10.1.1.50" into 10.11). MiniMax-M3 rejects `thinking` (HTTP 400)
# and `json_schema` (HTTP 405) - no reasoning fields on it, not used for
# simple_json.
#
# Prices from DeepInfra's model API: $/1M = cents_per_token * 10000; cache_read
# = input_price * rate_per_input_token_cached.
#
# Test: HTTP_CLIENT_TIMEOUT=30 ctester -config deepinfra.provider.yml -agents
# <type> -workers 1 (default 600s timeout otherwise blocks on hanging models).

simple:
  model: "MiniMaxAI/MiniMax-M3"
  temperature: 1.0
  top_p: 0.95
  top_k: 40
  n: 1
  max_tokens: 8192
  price:
    input: 0.30
    output: 1.20
    cache_read: 0.06

simple_json:
  model: "moonshotai/Kimi-K2.6"
