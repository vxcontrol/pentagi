# DeepInfra agent configuration.
#
# Strategy:
#   - DeepSeek V4 Flash for inexpensive utility calls;
#   - Gemma 4 31B for structured JSON;
#   - DeepSeek V4.1 Flash for planning and routine tool work.
#
# Prices were read from https://api.deepinfra.com/v1/openai/models on 2026-09-25
# and are dollars per 1M tokens.

simple:
  model: "deepseek-ai/DeepSeek-V4-Flash"
  temperature: 1.0
  top_p: 0.9
  repetition_penalty: 1.0
  n: 1
  max_tokens: 8192
  price:
    input: 0.09
    output: 0.18
    cache_read: 0.018

simple_json:
  model: "google/gemma-4-31B-it"
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.0
  n: 1
  max_tokens: 4096
  json: true
  price:
    input: 0.13
    output: 0.38

